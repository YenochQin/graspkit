[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grasp-kit"
version = '2.8.dev1'
# version = '2.6.1'
description = "Grasp toolkit package"

requires-python = ">= 3.12"

dependencies = [
  # 核心数据处理库
  "numpy>=2.0.0",
  "pandas>=2.2.2",
  "matplotlib>=3.8.4",
  "tqdm>=4.66.4",

  # 机器学习库 (CPU版本，使用Pixi可自动切换到GPU版本)
  "torch>=2.0.0",
  "scikit-learn>=1.3.0",
  "imbalanced-learn>=0.11.0",

  # 数据可视化
  "seaborn>=0.11.0",

  # 模型序列化和工具
  "joblib>=1.1.0",

  # 表格格式化
  "tabulate>=0.8.9",

  # 位数组处理 (可选)
  "bitarray>=2.0.0",

  # 配置文件处理
  "rtoml>=0.9.0",
]

[tool.pixi.project]
name = "graspkit"
description = "Grasp toolkit package"
authors = ["YenochQin <yenochqin@hotmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]

[tool.pixi.dependencies]
python = ">=3.12"
numpy = ">=2.0.0"
pandas = ">=2.2.2"
matplotlib = ">=3.8.4"
tqdm = ">=4.66.4"
scikit-learn = ">=1.3.0"
imbalanced-learn = ">=0.11.0"
seaborn = ">=0.11.0"
joblib = ">=1.1.0"
tabulate = ">=0.8.9"
bitarray = ">=2.0.0"
rtoml = ">=0.9.0"
h5py = ">=3.8.0"

[tool.pixi.feature.cpu.pypi-dependencies]
torch = { version = ">=2.0.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.15.0", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.gpu.pypi-dependencies]
torch = { version = ">=2.0.0", index = "https://download.pytorch.org/whl/cu118" }
torchvision = { version = ">=0.15.0", index = "https://download.pytorch.org/whl/cu118" }

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.0.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"

[tool.pixi.environments]
default = { features = ["cpu"] }
gpu = { features = ["gpu"] }
dev = { features = ["cpu", "dev"] }
dev-gpu = { features = ["gpu", "dev"] }

[tool.hatch.version]
path = "src/graspkit/version.py"

readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name="Yi(Yenoch) Qin", email="yenochqin@hotmail.com" }
]

classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  # "Development Status :: 5 - Production/Stable",
  "Development Status :: 4 - Beta",

  # Specify the Python versions you support here.
  "Programming Language :: Python",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graspkit"]

[tool.ruff.lint]
select = ["NPY201"]

[project.urls]
Homepage = "https://github.com/YenochQin/graspkit-tools.git"