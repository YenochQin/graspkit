[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graspkit-atomic"
dynamic = ["version"]
description = "Stable data I/O, processing, and plotting for GRASP calculations"
keywords = ["GRASP", "atomic physics", "data processing", "plotting"]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Yi (Yenoch) Qin", email = "yenochqin@hotmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

requires-python = ">= 3.14"

dependencies = [
    # 核心数据处理库
    "numpy>=2.4.2",
    "polars>=1.38.1",
    "matplotlib>=3.10.8",
    "cycler>=0.12.1",
    # 配置文件处理
    "rtoml>=0.13.0",
    "rich>=14.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "basedpyright>=1.34.0",
    # Jupyter notebook support
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.4",
    "ipython>=9.10.0",
    "ipykernel>=7.2.0",
    "notebook>=7.5.3",
    # Build and packaging tools
    "build>=1.4.0",
    "twine>=6.2.0",
]
all = [
    'graspkit-atomic[dev]',
    # Install with: uv sync --all-extras
]


[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.hatch.version]
path = "src/graspkit/version.py"

[tool.hatch.build.targets.sdist]
# Ship only the standalone library and its public installation/release docs.
only-include = [
    "src/graspkit",
    "src/graspkit_plot",
    "pyproject.toml",
    "LICENSE",
    "README.md",
    "README_zh.md",
    "INSTALL.md",
    "docs/releasing.md",
    "build_package.py",
    "scripts/check_release.py",
]

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/graspkit",
    "src/graspkit_plot",
]

[tool.ruff.lint]
select = ["NPY201"]
[tool.ruff.format]
# 格式化配置
quote-style = "double"

[tool.basedpyright]
include = ["src"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
pythonVersion = "3.14"
typeCheckingMode = "strict"
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false


[project.urls]
Homepage = "https://github.com/YenochQin/graspkit"
Source = "https://github.com/YenochQin/graspkit"
Issues = "https://github.com/YenochQin/graspkit/issues"
