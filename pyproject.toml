[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grasp-kit"
version = '3.0.dev3'
# version = '2.9.1'
description = "A Python package for processing and analyzing GRASP program calculation results And ML-driven CSF selection"
keywords = ["GRASP", "atomic physics", "quantum mechanics", "machine learning", "CSF selection", "data processing"]

requires-python = ">= 3.13,<3.14"

dependencies = [
    # 核心数据处理库
    "numpy>=2.4.2",
    "polars>=1.38.1",
    "pyarrow>=23.0.0",
    "matplotlib>=3.10.8",
    "tqdm>=4.67.3",
    # 机器学习库
    "scikit-learn>=1.8.0",
    "imbalanced-learn>=0.14.1",
    # 注意：PyTorch依赖已移至optional-dependencies
    # 使用 uv sync --extra cpu 或 uv sync --extra gpu 来安装PyTorch
    # 数据可视化
    "seaborn>=0.13.2",
    # 模型序列化和工具
    "joblib>=1.5.3",
    # 表格格式化
    "tabulate>=0.9.0",
    # 位数组处理 (可选)
    "bitarray>=3.8.0",
    # 配置文件处理
    "rtoml>=0.13.0",
    "pydantic>=2.0",
    # HDF5 支持
    "h5py>=3.15.1",
]

# Optional dependencies for different environments
# Use with: uv sync --extra cpu or uv sync --extra gpu
[project.optional-dependencies]

# CPU-optimized installation
cpu = [
    "torch==2.10.0",
    "torchvision==0.25.0",
]

# GPU-optimized installation (for NVIDIA GPUs with CUDA)
gpu = [
    "torch==2.10.0",
    "torchvision==0.25.0",
]
dev = [
    # 开发工具依赖（不包含PyTorch，需要额外指定 --extra cpu 或 --extra gpu）
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "mypy>=1.19.1",
    "black>=26.1.0",
    # Jupyter notebook support
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.4",
    "ipython>=9.10.0",
    "ipykernel>=7.2.0",
    "notebook>=7.5.3",
    # Build and packaging tools
    "build>=1.4.0",
    "twine>=6.2.0",
    "wheel>=0.46.3",
    # 安装命令: uv sync --extra dev --extra cpu (CPU版) 或 uv sync --extra dev --extra gpu (GPU版)
]
all = [
    'grasp-kit[dev]',
    'grasp-kit[cpu]',
    # Install with: uv sync --all-extras
]


# Removed custom PyTorch sources - using PyPI directly for torch
# PyPI provides platform-specific wheels automatically

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.hatch.version]
path = "src/graspkit/version.py"

readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name="Yi(Yenoch) Qin", email="yenochqin@hotmail.com" }
]

classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    # "Development Status :: 5 - Production/Stable",
    "Development Status :: 4 - Beta",

    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3",

    # Topic classification
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",

    # Environment
    "Environment :: Console",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graspkit"]

[tool.ruff.lint]
select = ["NPY201"]
[tool.ruff.format]
# 格式化配置
quote-style = "double"
[tool.mypy]
# mypy 配置
python_version = "3.13"
strict = true
disallow_untyped_defs = true

[project.urls]
Homepage = "https://github.com/YenochQin/graspkit.git"

[tool.pixi.workspace]
channels = ["https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge"]
platforms = ["linux-64", "osx-arm64", 'win-64']

[tool.pixi.pypi-dependencies]
grasp-kit = { path = ".", editable = true }
# rcsfs = { path = "../graspkit-tools/package/rcsfs/rcsfs-0.1.0-cp313-cp313-manylinux_2_28_x86_64.whl" }

[tool.pixi.environments]
# default = { solve-group = "default" }
default = { features = ["gpu", "dev"], solve-group = "default" }
all = { features = ["all"], solve-group = "default" }
cpu = { features = ["cpu"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "default" }
dev-gpu = { features = ["dev", "gpu"], solve-group = "default" }

[tool.pixi.tasks]
