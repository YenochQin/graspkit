[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grasp-kit"
version = '2.8.dev1'
# version = '2.6.1'
description = "A Python package for processing and analyzing GRASP program calculation results with ML-driven CSF selection"
keywords = ["GRASP", "atomic physics", "quantum mechanics", "machine learning", "CSF selection", "data processing"]

requires-python = ">= 3.12"

dependencies = [
  # 核心数据处理库
  "numpy>=2.0.0",
  "pandas>=2.2.2",
  "matplotlib>=3.8.4",
  "tqdm>=4.66.4",

  # 机器学习库
  "scikit-learn>=1.3.0",
  "imbalanced-learn>=0.11.0",

  # 数据可视化
  "seaborn>=0.11.0",

  # 模型序列化和工具
  "joblib>=1.1.0",

  # 表格格式化
  "tabulate>=0.8.9",

  # 位数组处理 (可选)
  "bitarray>=2.0.0",

  # 配置文件处理
  "rtoml>=0.9.0",

  # HDF5 支持
  "h5py>=3.8.0",

]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# Optional dependencies for different environments
# Use with: uv sync --extra cpu or uv sync --extra gpu
[project.optional-dependencies]

# CPU-optimized installation
cpu = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]

# GPU-optimized installation (for NVIDIA GPUs with CUDA)
cu128 = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]
dev = [
    # Use CPU-only PyTorch for development to avoid CUDA dependencies
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    # Jupyter notebook support
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipython>=8.0.0",
    "ipykernel>=6.0.0",
    "notebook>=7.0.0",
    # Build and packaging tools
    "build>=0.10.0",
    "twine>=4.0.0",
    "wheel>=0.40.0",
    # Install with: uv sync --extra dev (CPU-only)
]
all = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    # Jupyter notebook support
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipython>=8.0.0",
    "ipykernel>=6.0.0",
    "notebook>=7.0.0",
    # Install with: uv sync --all-extras
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
]
default-index = "tsinghua"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.indexes]]
tsinghua = "https://pypi.tuna.tsinghua.edu.cn/simple"
aliyun = "https://mirrors.aliyun.com/pypi/simple/"

[tool.hatch.version]
path = "src/graspkit/version.py"

readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name="Yi(Yenoch) Qin", email="yenochqin@hotmail.com" }
]

classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  # "Development Status :: 5 - Production/Stable",
  "Development Status :: 4 - Beta",

  # Specify the Python versions you support here.
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",

  # Topic classification
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",

  # Environment
  "Environment :: Console",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graspkit"]

[tool.ruff.lint]
select = ["NPY201"]


[project.urls]
Homepage = "https://github.com/YenochQin/graspkit-tools.git"