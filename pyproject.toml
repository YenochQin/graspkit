[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grasp-kit"
version = "3.4.dev1"
# version = '2.9.1'
description = "Stable data I/O, processing, and plotting for GRASP calculations"
keywords = ["GRASP", "atomic physics", "data processing", "plotting"]

requires-python = ">= 3.14"

dependencies = [
    # 核心数据处理库
    "numpy>=2.4.2",
    "polars>=1.38.1",
    "pyarrow>=23.0.0",
    "matplotlib>=3.10.8",
    # 配置文件处理
    "rtoml>=0.13.0",
    "rich>=14.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.1",
    "mypy>=1.19.1",
    "black>=26.1.0",
    "types-tabulate>=0.9.0",
    # Jupyter notebook support
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.4",
    "ipython>=9.10.0",
    "ipykernel>=7.2.0",
    "notebook>=7.5.3",
    # Build and packaging tools
    "build>=1.4.0",
    "twine>=6.2.0",
    "wheel>=0.46.3",
]
all = [
    'grasp-kit[dev]',
    # Install with: uv sync --all-extras
]


[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.hatch.version]
path = "src/graspkit/version.py"

readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name="Yi(Yenoch) Qin", email="yenochqin@hotmail.com" }
]

classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    # "Development Status :: 5 - Production/Stable",
    "Development Status :: 4 - Beta",

    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3",

    # Topic classification
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",

    # Environment
    "Environment :: Console",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/graspkit",
    "src/graspkit_plot",
]

[tool.ruff.lint]
select = ["NPY201"]
[tool.ruff.format]
# 格式化配置
quote-style = "double"
[tool.mypy]
# mypy 配置
python_version = "3.14"
strict = true
disallow_untyped_defs = true

[tool.basedpyright]
include = ["src"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportMissingTypeStubs = false


[project.urls]
Homepage = "https://github.com/YenochQin/graspkit.git"
