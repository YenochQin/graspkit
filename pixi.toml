[workspace]
authors = ["YenochQin <yenochqin@hotmail.com>"]
channels = ["conda-forge"]
name = "graspkit"
platforms = ["linux-64", "win-64"]
version = '2.8.dev1'

[tasks]

[dependencies]
python = ">=3.13.9,<3.14"
numpy = ">=2.3.3,<3"
matplotlib = ">=3.10.7,<4"
tqdm = ">=4.67.1,<5"
joblib = ">=1.5.2,<2"
tabulate = ">=0.9.0,<0.10"
bitarray = ">=3.7.2,<4"
rtoml = ">=0.12.0,<0.13"
pandas = ">=2.3.3,<3"
scikit-learn = ">=1.7.2,<2"
imbalanced-learn = ">=0.14.0,<0.15"
seaborn = ">=0.13.2,<0.14"
h5py = ">=3.15.1,<4"

ipython = ">=9.6.0,<10"
jupyter = ">=1.1.1,<2"

[feature.gpu]
system-requirements = { cuda = "12.0" }
[feature.gpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu124" }

[feature.cpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cpu" }

[environments]
gpu = { features = ["gpu"] }
# Make CPU the default environment
default = { features = ["cpu"] }
