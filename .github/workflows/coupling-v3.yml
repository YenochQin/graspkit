name: Test V3 coupling

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  coupling-v3:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install the library and V3 test dependencies
        run: >-
          python -m pip install --only-binary=:all: . 'pytest>=9.0.2' 'rcsfs>=3.2.0,<4'
      - name: Test coupling against real V3 Parquet data
        env:
          GRASPKIT_TEST_RCSFS_V3: "1"
        run: |
          mkdir -p temp/tests
          python -m pytest -v tests/test_csfs_processor_coupling.py --basetemp=temp/tests/coupling-v3
